name: Deploy bluecat.cc

on:
  push:
    branches: [main]
    paths:
      - 'land_site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: land_site/package-lock.json

      - name: Install dependencies
        working-directory: land_site
        run: npm ci

      - name: Build
        working-directory: land_site
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_WHATSAPP_URL: ${{ secrets.VITE_WHATSAPP_URL }}
          VITE_CONTACT_EMAIL: ${{ secrets.VITE_CONTACT_EMAIL }}
        run: npm run build

      - name: Deploy over rsync/ssh
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: land_site/dist/
          remote_path: /var/www/bluecat.cc/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
